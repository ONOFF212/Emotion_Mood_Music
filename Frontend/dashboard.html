


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Aura</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">Aura</a>
        <div class="nav-links">
            <a href="dashboard.html" class="btn btn-primary">Dashboard</a>
            <a href="history.html" class="btn">History</a>
            <a href="profile.html" class="btn btn-primary">Profile</a>
        </div>
    </nav>
    <div class="container">
        <h2 style="margin-bottom: 2rem;">Discover your Mood</h2>
        <div class="dashboard-grid">
            <div class="glass-panel">
            <h3>Capture Emotion</h3>
            <p>Look at the camera and snap a photo to get a music recommendation</p>
                <div class="camera-container">
                    <video id="webcam" autoplay playsinline></video>
                    <img id="snapshot" class="hidden" alt="Captured Emotion">
                </div>
                <div class="camera-controls">
                    <button id="class-capture" class="btn btn-primary">Capture</button>
                    <button id="class-Retake" class="btn hidden">Retake</button>
                    <button id="class-Analyze" class="btn btn-primary hidden">Analyze</button>
                </div>
            </div>

            <div class="glass-panel_ytvideo">
                <h3>Your SoundTrack</h3>
                <div id="loader" class="loader"></div>
                <div id="music-result" class="music-recommendation hidden">
                    <h4 style="font-size: 1.2rem; margin-bottom: 0.5rem;">Detcted Emotion:</h4>

                    <div class="video-container">
                        <iframe id="youtube-player" src="",  allowfullscreen></iframe>
                    </div>
                </div>
                <div id="empty-states" class="music-recommendation">
                    <p>Capture a photo to see your personalized music recommendation here</p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
