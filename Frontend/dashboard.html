


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Aura</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">
                <img src="log.png" alt="Logo" class="logo-img"></img> Home</a>
        <div class="nav-links">
            <a href="dashboard.html" class="btn btn-primary">Dashboard</a>
            <a href="history.html" class="btn">History</a>
            <a href="profile.html" class="btn btn-primary">Profile</a>
        </div>
    </nav>
    <div class="container">
        <h2 style="margin-bottom: 2rem;">Discover your Mood</h2>
        <div class="dashboard-grid">
            <div class="glass-panel">
            <h3>Capture Emotion</h3>
            <p>Look at the camera and snap a photo to get a music recommendation</p>
            <div class="language-selection">
                    <label for="language">Choose Language:</label>
                    <select id="language">
                        <option value="Nepali">Nepali</option>
                        <option value="Hindi">Hindi</option>
                        <option value="English">English</option>
                    </select>
                </div>
                <div class="camera-container">
                    <video id="webcam" autoplay playsinline></video>
                    <img id="snapshot" class="hidden" alt="Captured Emotion">
                </div>
                <div class="camera-controls">
                    <button id="class-capture" class="btn btn-primary">Capture</button>
                    <button id="class-Retake" class="btn hidden">Retake</button>
                    <button id="class-Analyze" class="btn btn-primary hidden">Analyze</button>
                </div>
            </div>

            <div class="glass-panel_ytvideo">
                <h3>Your SoundTrack</h3>
                <div id="loader" class="loader"></div>
                <div id="music-result" class="music-recommendation hidden">
                    <h4 style="font-size: 1.2rem; margin-bottom: 0.5rem;">Detcted Emotion:<span id="detected-emotion" class="emotion-badge"></span></h4>
                    <p id="track-title" style="color: var(--text-color); font-weight: 500;"></p>

                    <div class="video-container">
                        <iframe id="youtube-player" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"  allowfullscreen></iframe>
                    </div>
                </div>
                <div id="empty-state" class="music-recommendation">
                    <p>Capture a photo to see your personalized music recommendation here</p>
                    
                </div>
                
            </div>

            <div id="playList" class="glass-panel_playList">
                <h3>Recommened Songs Playlist</h3>
                <div id="playlist-items">
                    <p>No songs yet</p>
                </div>

            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/dashboard.js"></script>

</body>
</html>
