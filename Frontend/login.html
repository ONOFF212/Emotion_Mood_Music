

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <title>Log IN | Aura</title>
        <link rel="stylesheet" href="css/styles.css">
    </head>

    <body>
        <nav>
            <a href="index.html" class="logo">
                <img src="log.png" alt="Logo" class="logo-img"></img> </a>
            <div class="auth-buttons">
                <a href="signup.html" class="btn btn-primary">SignUP</a>
            </div>
        </nav>

        <div class="container auth-container">
            <div class="glass-panel_login_signup auth-card">
                <h2>Welcome Back</h2>
                <p>Log In to continue to Aura</p>

                <form id="login-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" autocomplete="password" required>
                    </div>
                    <div id="login-error"  class="login-error"></div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" >LogIn</button>
                </form>

                <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;" >
                    Don't have an account? <a href="signup.html" style="color: var(--accent-secondary); text-decoration: none;">Sign Up</a>
                </p>
            </div>
        </div>

        <script src="js/api.js"></script>
        <script src="js/auth.js"></script>
        <script>
            document.getElementById('login-form').addEventListener('submit', async (e) =>{
                e.preventDefault();
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const errorEl = document.getElementById('login-error');

                errorEl.style.display = 'none';
                

                const success = await Auth.login(username, password);
                if(success){
                    window.location.href = 'dashboard.html';
                } else{
                    errorEl.innerText = "Invalid username or password";
                    errorEl.style.display = 'block';
                }
            });
        </script>
    </body>
</html>
